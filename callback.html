<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAuth Callback — Ndamathia</title>
  <link rel="icon" type="image/png" href="/ndamathia/static/favicon-32.png">
  <link rel="apple-touch-icon" href="/ndamathia/static/apple-touch-icon.png">
  <link rel="shortcut icon" href="/ndamathia/static/favicon.ico">
  <meta property="og:title" content="OAuth Callback — Ndamathia">
  <meta property="og:site_name" content="Ndamathia">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ndamathia/static/style.css">
</head>
<body>
  <div class="legal" style="text-align:center; padding-top: 120px;">
    <h1>Processing OAuth callback...</h1>
    <p class="subtitle">Redirecting to the Ndamathia backend.</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    if (code) {
      // Redirect to the Tailscale-hosted Flask backend for token exchange
      window.location.href = 'https://iostream-latitude-e7470.tail04245c.ts.net/tiktok/callback?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state || '');
    } else {
      document.querySelector('.legal').innerHTML = '<div class="card"><h3>No code received</h3><p>No authorization code was found in the URL. Please try connecting your TikTok account again.</p><p><a class="btn" href="/ndamathia/">Back to home</a></p></div>';
    }
  </script>
</body>
</html>
