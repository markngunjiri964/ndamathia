<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OAuth Callback — Ndamathia Poster</title>
</head>
<body>
  <p>Processing OAuth callback...</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const state = params.get('state');
    if (code) {
      window.location.href = 'http://localhost:5050/callback?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state || '');
    } else {
      document.body.innerHTML = '<p>No code received. Check the URL parameters.</p>';
    }
  </script>
</body>
</html>
